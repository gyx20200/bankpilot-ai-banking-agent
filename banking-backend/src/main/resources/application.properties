spring.application.name=bankpilot-banking-backend
server.port=8080
server.address=127.0.0.1
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bankpilot
spring.datasource.username=bankpilot_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
# Day7 local-demo feature flags. Values belong in environment, never Git secrets.
bankpilot.day7.initial-balance=${BANKPILOT_DAY7_INITIAL_BALANCE:10000.00}
bankpilot.day7.jobs.enabled=${BANKPILOT_DAY7_JOBS_ENABLED:false}
bankpilot.demo.otp.debug-enabled=${BANKPILOT_DEMO_OTP_DEBUG_ENABLED:false}
bankpilot.day7.legacy-bootstrap.enabled=${BANKPILOT_DAY7_LEGACY_BOOTSTRAP_ENABLED:false}
bankpilot.day7.legacy-xiaoming.password=${BANKPILOT_DAY7_LEGACY_XIAOMING_PASSWORD:}
bankpilot.day7.legacy-xiaoming.phone=${BANKPILOT_DAY7_LEGACY_XIAOMING_PHONE:}
bankpilot.day7.legacy-lisi.password=${BANKPILOT_DAY7_LEGACY_LISI_PASSWORD:}
bankpilot.day7.legacy-lisi.phone=${BANKPILOT_DAY7_LEGACY_LISI_PHONE:}
